<div class="container">
  <div class="row login_container">
    <div class="col-md-7 loginImage">
      <img
        class="imagefluid"
        src="assets/img/loginpageimage.jpg"
        alt="My Image"
      />
    </div>
    <div class="col-md-5 loginForm">
      <form #LogInForm="ngForm">
        <mat-form-field appearance="fill">
          <mat-label>Mobile Number</mat-label>
          <input matInput name="Mobile" [(ngModel)]="Mobile" />
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Enter your password</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            name="Password"
            [(ngModel)]="Password"
          />
          <button
            mat-icon-button
            matSuffix
            (click)="hide = !hide"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hide"
          >
            <mat-icon>{{ hide ? "visibility_off" : "visibility" }}</mat-icon>
          </button>
        </mat-form-field>
        <button
          mat-raised-button
          color="primary"
          [disabled]="showLoader"
          (click)="LogIn(LogInForm.value)"
        >
          Login
        </button>
        <mat-progress-bar
          mode="indeterminate"
          class="mt-3"
          *ngIf="showLoader"
        ></mat-progress-bar>
      </form>

      <div>
        <div routerLink="/register">Don't have an account? Register</div>
      </div>
    </div>
  </div>
</div>
